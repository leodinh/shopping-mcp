# Local services for development. Postgres runs on the host (see README); Redis is optional and
# only backs the search cache: without REDIS_URL, every search asks the stores live.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
